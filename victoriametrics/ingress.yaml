apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoriametrics
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-victoriametrics@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - metrics.timam.dev
  rules:
    - host: metrics.timam.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: victoriametrics
                port:
                  number: 8428
