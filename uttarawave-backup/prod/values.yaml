name: prod-uttarawave-backup
namespace: uttarawave

schedule: "*/5 * * * *"
timeZone: Asia/Dhaka
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 5
backoffLimit: 1
restartPolicy: Never
activeDeadlineSeconds: 3600
ttlSecondsAfterFinished: 86400

images:
  postgres:
    repository: public.ecr.aws/docker/library/postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  aws:
    repository: public.ecr.aws/aws-cli/aws-cli
    tag: "2.15.57"
    pullPolicy: IfNotPresent

config:
  existingSecret: prod-uttarawave-backend-config
  key: server.yaml

awsSecret:
  existingSecret: uttarawave-db-backup-aws

s3:
  bucket: uttarawave.com
  prefix: backups/db
  region: us-west-2

resources:
  dump:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  upload:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
